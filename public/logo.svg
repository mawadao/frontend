<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#24243e"/>
      <stop offset="1" stop-color="#302b63"/>
    </linearGradient>
    <linearGradient id="mstroke" x1="130" y1="160" x2="382" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7b733"/>
      <stop offset="1" stop-color="#fc4a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7f5af0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7f5af0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="200" fill="url(#glow)"/>

  <!-- faint community nodes in the corners -->
  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="92" cy="96" r="6"/>
    <circle cx="420" cy="96" r="6"/>
    <circle cx="92" cy="416" r="6"/>
    <circle cx="420" cy="416" r="6"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
    <line x1="92" y1="96" x2="130" y2="160"/>
    <line x1="420" y1="96" x2="382" y2="160"/>
    <line x1="92" y1="416" x2="130" y2="352"/>
    <line x1="420" y1="416" x2="382" y2="352"/>
  </g>

  <!-- M monogram as a connected network path -->
  <path d="M130,352 L130,160 L256,280 L382,160 L382,352"
        stroke="url(#mstroke)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- joint nodes -->
  <g fill="#f7b733">
    <circle cx="130" cy="352" r="17"/>
    <circle cx="130" cy="160" r="17"/>
    <circle cx="256" cy="280" r="19"/>
    <circle cx="382" cy="160" r="17"/>
    <circle cx="382" cy="352" r="17"/>
  </g>
</svg>
